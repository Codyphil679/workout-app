name: Release APK

# Publishes a GitHub Release with the installable APK and the PDF install guide.
# Start it either by pushing a tag like v1.0.1, or from the Actions tab ("Run workflow").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.1 (no leading v)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="$INPUT_VERSION"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.2.3, got '$V'"; exit 1; fi
          if gh release view "v$V" >/dev/null 2>&1; then echo "::error::Release v$V already exists. Use a new version number."; exit 1; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Load permanent signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFTLOG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LIFTLOG_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the permanent release key."
          else
            echo "::warning::No LIFTLOG_KEYSTORE_BASE64 secret. The APK is signed with a throwaway debug key, so future versions will NOT install over this one."
          fi

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --tests '*RepositoryTest' --tests '*BackupTest' --tests '*UnitsAndStatsTest' --tests '*ProgressionTest' --tests '*MigrationTest' --tests '*PercentAndRpeTest' --tests '*RecoveryRecapTest' --tests '*HealthRecordsTest' --tests '*BugRegressionTest'

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          LIFTLOG_KEYSTORE_PASSWORD: ${{ secrets.LIFTLOG_KEYSTORE_PASSWORD }}
          LIFTLOG_KEY_ALIAS: ${{ secrets.LIFTLOG_KEY_ALIAS }}
          LIFTLOG_KEY_PASSWORD: ${{ secrets.LIFTLOG_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "LiftLog-${VERSION_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.name }}
        run: |
          cat > notes.md <<NOTES
          ## Install on your Android phone

          1. On your phone, tap **LiftLog-${V}.apk** under **Assets** below to download it.
          2. Open it and follow the prompts. Allow Chrome to install apps when asked, then tap **Install**.

          Step-by-step guide: **LiftLog-Install-Guide.pdf** below, or [read it online](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/INSTALL.md).

          Requires Android 8.0 or newer. Not available for iPhone.
          NOTES
          gh release create "v${V}" "LiftLog-${V}.apk" docs/LiftLog-Install-Guide.pdf \
            --target "$GITHUB_SHA" --title "LiftLog ${V}" --notes-file notes.md --latest
